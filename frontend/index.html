<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VECTOR Assessment Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #0B1929;
      --blue: #1A6BAF;
      --gold: #C9A84C;
      --cyan: #00C8E8;
      --white: #FFFFFF;
      --gray: #8A9BB0;
      --light: #E8EEF4;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .screen { display: none; }
    .screen.active { display: block; }

    /* Login Screen */
    .login-form {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 { font-size: 32px; margin-bottom: 30px; text-align: center; }
    .form-group {
      margin-bottom: 20px;
    }
    label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: var(--white);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: var(--gold); }
    input::placeholder { color: rgba(255,255,255,0.3); }
    select option { background: var(--navy); color: var(--white); }

    .btn {
      width: 100%;
      padding: 15px;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 20px;
    }
    .btn:hover { background: #E8C46A; transform: translateY(-2px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Assessment Screen */
    .assess-header {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin: 0 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--gold);
      width: 0%;
      transition: width 0.3s;
    }

    .question-card {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .question-card h2 { font-size: 20px; margin-bottom: 30px; line-height: 1.5; }
    .options { margin: 30px 0; }
    .option {
      padding: 15px 20px;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      gap: 15px;
    }
    .option:hover { border-color: var(--cyan); }
    .option.selected { border-color: var(--gold); background: rgba(201,168,76,0.1); }
    .option input { display: none; }
    .option label { margin: 0; flex: 1; cursor: pointer; font-size: 14px; color: var(--white); }

    .nav-buttons {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }
    .btn-back, .btn-next {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: var(--white);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--cyan); }
    .btn-next { background: var(--gold); color: var(--navy); font-weight: 600; opacity: 0.3; pointer-events: none; }
    .btn-next.ready { opacity: 1; pointer-events: all; }

    /* Report Screen */
    .report {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .report-header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 2px solid var(--gold);
    }
    .vector-sign { font-size: 48px; font-weight: 700; color: var(--gold); margin: 20px 0; font-family: monospace; letter-spacing: 3px; }
    .vector-class { font-size: 28px; margin-bottom: 10px; }
    .class-desc { font-size: 14px; color: var(--gray); font-style: italic; }

    .dimensions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin: 30px 0;
    }
    .dim-card {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid var(--cyan);
    }
    .dim-label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
    .dim-score { font-size: 24px; font-weight: 700; color: var(--gold); margin: 10px 0; }

    .btn-download {
      width: 100%;
      padding: 15px;
      background: var(--cyan);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 30px;
    }
    .btn-download:hover { opacity: 0.9; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" class="screen active">
  <div class="container">
    <h1>🔤 VECTOR Assessment</h1>
    <form class="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="name@company.com">
      </div>
      <div class="form-group">
        <label>Employee ID</label>
        <input type="text" id="emp_id" required placeholder="EMP-12345">
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Primary Role</label>
        <select id="role" required>
          <option value="">Select your role...</option>
          <option value="eng">Software Engineer / Technology</option>
          <option value="con">Consultant / Strategy</option>
          <option value="fin">Finance / Risk</option>
          <option value="hr">HR / L&D / People</option>
          <option value="del">Delivery / Project Management</option>
        </select>
      </div>
      <div class="form-group">
        <label>Attempt Type</label>
        <select id="attempt_type" required>
          <option value="">Select attempt type...</option>
          <option value="Pre-Program">Pre-Program</option>
          <option value="Post-Program">Post-Program</option>
        </select>
      </div>
      <button type="submit" class="btn">Begin Assessment</button>
    </form>
  </div>
</div>

<!-- Assessment Screen -->
<div id="assess-screen" class="screen">
  <div class="container">
    <div class="assess-header">
      <span id="progress-text">1 / 30</span>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <div class="question-card">
      <h2 id="question-text"></h2>
      <div class="options" id="options"></div>
      <div class="nav-buttons">
        <button class="btn-back" onclick="prevQuestion()" id="btn-back">← Back</button>
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  </div>
</div>

<!-- Report Screen -->
<div id="report-screen" class="screen">
  <div class="container">
    <div class="report">
      <div class="report-header">
        <h1>VECTOR Assessment Report</h1>
        <div id="user-info" style="margin: 20px 0; color: var(--gray);"></div>
        <div class="vector-class" id="class-name"></div>
        <div class="vector-sign" id="vector-sign"></div>
        <div class="class-desc" id="class-desc"></div>
      </div>

      <h3 style="margin-bottom: 20px;">Dimension Scores</h3>
      <div class="dimensions" id="dimensions"></div>

      <button class="btn-download" onclick="downloadReport()">⬇️ Download Report (PDF)</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:3000';
let currentQuestion = 0;
let questions = [];
let responses = {};
let userData = {};
let reportData = {};

async function handleLogin(e) {
  e.preventDefault();
  userData = {
    email: document.getElementById('email').value,
    emp_id: document.getElementById('emp_id').value,
    name: document.getElementById('name').value,
    role: document.getElementById('role').value,
    attempt_type: document.getElementById('attempt_type').value
  };

  try {
    const res = await fetch(`${API}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(userData)
    });
    const data = await res.json();
    localStorage.setItem('token', data.token);

    // Load questions for role
    const qRes = await fetch(`${API}/api/questions/${userData.role}`);
    questions = await qRes.json();

    showScreen('assess-screen');
    loadQuestion();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

function loadQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('question-text').textContent = `Q${currentQuestion + 1}. ${q.text}`;

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  q.opts.forEach(opt => {
    optionsDiv.innerHTML += `
      <label class="option">
        <input type="radio" name="answer" value="${opt.s}" onchange="selectOption(this)">
        <strong>${opt.l}.</strong> ${opt.t}
      </label>
    `;
  });

  updateProgress();
  document.getElementById('btn-back').style.display = currentQuestion === 0 ? 'none' : 'block';
  document.getElementById('btn-next').textContent = currentQuestion === questions.length - 1 ? 'Submit' : 'Next →';
}

function selectOption(input) {
  const qId = questions[currentQuestion].id;
  responses[qId] = input.value;

  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  input.parentElement.classList.add('selected');

  document.getElementById('btn-next').classList.add('ready');
}

function nextQuestion() {
  if (!responses[questions[currentQuestion].id]) return;

  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion();
  } else {
    submitAssessment();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion();
  }
}

function updateProgress() {
  const progress = ((currentQuestion + 1) / questions.length) * 100;
  document.getElementById('progress-fill').style.width = progress + '%';
  document.getElementById('progress-text').textContent = `${currentQuestion + 1} / ${questions.length}`;
}

async function submitAssessment() {
  try {
    const token = localStorage.getItem('token');
    const res = await fetch(`${API}/api/save-assessment`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ responses })
    });
    const data = await res.json();
    reportData = data.report || { vector_sign: 'V1V1V1V1V1V1', vector_class: 'V1', class_name: 'Executor', dimension_scores: {} };
    showReport();
  } catch (err) {
    alert('Error saving assessment: ' + err.message);
  }
}

function showReport() {
  showScreen('report-screen');
  document.getElementById('user-info').innerHTML = `${userData.name} • ${userData.role} • ${userData.attempt_type}`;
  document.getElementById('class-name').textContent = reportData.class_name || 'Loading...';
  document.getElementById('vector-sign').textContent = reportData.vector_sign || 'V1V1V1V1V1V1';
  document.getElementById('class-desc').textContent = reportData.class_desc || '';

  const dims = ['V', 'E', 'C', 'T', 'O', 'R'];
  document.getElementById('dimensions').innerHTML = dims.map(d => `
    <div class="dim-card">
      <div class="dim-label">${d}</div>
      <div class="dim-score">${reportData.dimension_scores?.[d] || '0'}</div>
    </div>
  `).join('');
}

function downloadReport() {
  alert('PDF download functionality coming soon!');
  // Will implement HTML to PDF conversion
}

function showScreen(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screen).classList.add('active');
}
</script>

</body>
</html>
